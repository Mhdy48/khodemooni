  <!-- ============ LIGHTBOX ============ -->
  <div id="lightbox" class="fixed inset-0 z-[90] hidden items-center justify-center p-4 sm:p-10" role="dialog" aria-modal="true" aria-label="نمایش تصویر">
    <div id="lightbox-backdrop" class="absolute inset-0 bg-ink-950/95 backdrop-blur-sm"></div>
    <button id="lightbox-close" type="button" class="absolute top-5 left-5 z-10 grid size-11 place-items-center rounded-full text-bone-50 ring-1 ring-bone-50/30 hover:bg-bone-50/10 transition" aria-label="بستن">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button id="lightbox-prev" type="button" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 z-10 gallery-btn gallery-btn-light" aria-label="تصویر قبلی">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
    </button>
    <button id="lightbox-next" type="button" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 z-10 gallery-btn gallery-btn-light" aria-label="تصویر بعدی">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6l-6 6 6 6"/></svg>
    </button>
    <figure class="relative z-[5] max-w-4xl w-full text-center">
      <img id="lightbox-img" src="" alt="" class="mx-auto max-h-[74vh] w-auto rounded-2xl ring-1 ring-thread-500/30 shadow-2xl object-contain" />
      <figcaption class="mt-5 flex items-center justify-center gap-4">
        <span id="lightbox-caption" class="text-bone-100 font-bold"></span>
        <span id="lightbox-counter" class="text-xs text-thread-400 tabular-nums"></span>
      </figcaption>
    </figure>
  </div>
